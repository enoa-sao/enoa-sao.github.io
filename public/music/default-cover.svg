<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Music cover">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#121a3c"/>
			<stop offset="0.55" stop-color="#2b2f6e"/>
			<stop offset="1" stop-color="#0b6f8d"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.28" cy="0.2" r="0.85">
			<stop offset="0" stop-color="#a8c8ff" stop-opacity="0.5"/>
			<stop offset="1" stop-color="#a8c8ff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#cfe6ff"/>
