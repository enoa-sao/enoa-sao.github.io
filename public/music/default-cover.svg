	</g>
	<g fill="url(#bars)" opacity="0.95">
		<rect x="190" y="256" width="28" height="88" rx="14"/>
		<rect x="238" y="225" width="28" height="150" rx="14"/>
		<rect x="286" y="182" width="28" height="236" rx="14"/>
		<rect x="334" y="225" width="28" height="150" rx="14"/>
		<rect x="382" y="256" width="28" height="88" rx="14"/>
	</g>
</svg>
